<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Desktop 逆向图谱 · v2.42304.0</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2129; --line:#30363d;
  --fg:#e6edf3; --dim:#8b949e; --acc:#d97757; --acc2:#58a6ff;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --pur:#bc8cff;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
/* ---------- top bar ---------- */
header{
  display:flex;align-items:center;gap:16px;padding:0 18px;height:52px;
  background:linear-gradient(180deg,#1a1f27,#141920);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.logo{font-weight:700;letter-spacing:.4px;font-size:15px}
.logo b{color:var(--acc)}
.ver{font:11px/1 var(--mono);color:var(--dim);
  background:var(--bg3);border:1px solid var(--line);padding:4px 7px;border-radius:5px}
.pills{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{
  font:11px/1 var(--mono);color:var(--dim);background:var(--bg3);
  border:1px solid var(--line);padding:5px 8px;border-radius:20px;white-space:nowrap;
}
.pill b{color:var(--acc2);font-weight:600}
/* ---------- layout ---------- */
main{display:flex;flex:1;min-height:0}
nav{
  width:216px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--line);
  padding:10px 0;overflow-y:auto;
}
nav button{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 16px;
  background:none;border:0;border-left:2px solid transparent;color:var(--dim);
  font:13px inherit;cursor:pointer;text-align:left;
}
nav button:hover{background:var(--bg3);color:var(--fg)}
nav button.on{background:var(--bg3);color:var(--fg);border-left-color:var(--acc);font-weight:600}
nav button .ic{width:16px;text-align:center;opacity:.85}
nav button .ct{margin-left:auto;font:10px var(--mono);color:var(--dim);
  background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:9px}
nav .grp{font:10px/1 var(--mono);color:#586069;text-transform:uppercase;
  letter-spacing:1px;padding:14px 16px 6px}
section{flex:1;min-width:0;display:flex;flex-direction:column}
/* ---------- search ---------- */
.searchbar{
  display:flex;gap:10px;padding:12px 18px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.searchbar input{
  flex:1;background:var(--bg);border:1px solid var(--line);color:var(--fg);
  padding:9px 12px;border-radius:7px;font:13px var(--mono);outline:none;
}
.searchbar input:focus{border-color:var(--acc2)}
.searchbar .hint{font:11px/1.5 var(--mono);color:#586069;align-self:center;white-space:nowrap}
/* ---------- content ---------- */
#view{flex:1;overflow-y:auto;padding:20px 24px 60px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px;
  border-bottom:1px solid var(--line);padding-bottom:12px}
h2{font-size:14.5px;margin:26px 0 10px;color:var(--fg);
  display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:14px;background:var(--acc);border-radius:2px}
h3{font-size:13px;margin:16px 0 7px;color:var(--dim);font-weight:600}
p{margin:8px 0;color:#c9d1d9}
code{font-family:var(--mono);font-size:12px;background:var(--bg3);
  border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:#e6b8a2}
a.src{font:11px var(--mono);color:var(--acc2);text-decoration:none;cursor:pointer}
a.src:hover{text-decoration:underline}
/* ---------- cards / grids ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  cursor:pointer;transition:.12s;position:relative;
}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card.static{cursor:default}
.card.static:hover{transform:none;border-color:var(--line)}
.card .t{font-weight:600;font-size:13px;margin-bottom:5px}
.card .n{font:22px/1.2 var(--mono);color:var(--acc);font-weight:600}
.card .d{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.card .bar{height:3px;background:var(--bg);border-radius:2px;margin-top:9px;overflow:hidden}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--pur))}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
th{text-align:left;padding:8px 10px;background:var(--bg3);color:var(--dim);
  font:11px var(--mono);text-transform:uppercase;letter-spacing:.6px;
  border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #21262d;vertical-align:top}
tr:hover td{background:#161b22}
td.num{font-family:var(--mono);text-align:right;color:var(--acc2);white-space:nowrap}
td.mono{font-family:var(--mono);font-size:11.5px;color:#c9d1d9;word-break:break-all}
/* ---------- misc ---------- */
.tag{display:inline-block;font:10.5px/1 var(--mono);padding:3px 6px;border-radius:4px;
  background:var(--bg3);border:1px solid var(--line);color:var(--dim);margin:2px 3px 2px 0}
.tag.s{color:var(--ok);border-color:#238636}
.tag.r{color:var(--acc2);border-color:#1f6feb}
.tag.d{color:var(--pur);border-color:#8957e5}
.tag.i{color:var(--warn);border-color:#9e6a03}
.tag.u{color:var(--bad);border-color:#da3633}
.ev{font:10px/1 var(--mono);padding:2px 5px;border-radius:3px;font-weight:700}
.ev.S{background:#238636;color:#fff}
.ev.R{background:#1f6feb;color:#fff}
.ev.D{background:#8957e5;color:#fff}
.ev.I{background:#9e6a03;color:#fff}
.ev.U{background:#da3633;color:#fff}
pre{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:12px 14px;border-radius:6px;overflow-x:auto;font:11.5px/1.65 var(--mono);
  color:#c9d1d9;margin:10px 0}
.badge{display:inline-block;font:10px var(--mono);padding:2px 7px;border-radius:10px;
  background:var(--bg3);border:1px solid var(--line);color:var(--dim)}
.empty{color:var(--dim);font-style:italic;padding:30px 0;text-align:center}
ul.clean{margin:8px 0;padding-left:20px}
ul.clean li{margin:5px 0;color:#c9d1d9}
.kv{display:grid;grid-template-columns:190px 1fr;gap:3px 14px;font-size:12.5px;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:13px 16px}
.kv dt{color:var(--dim);font-family:var(--mono);font-size:11.5px}
.kv dd{margin:0;color:#c9d1d9;font-family:var(--mono);font-size:11.5px;word-break:break-all}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px}
.kvgrid>div{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;
  background:var(--bg2);border:1px solid var(--line);border-radius:6px;
  font-family:var(--mono);font-size:11.5px}
.kvgrid span{color:var(--dim)}
.kvgrid b{color:var(--acc2)}
/* ---------- demo ---------- */
.demo{border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:#f9f9f7;margin:14px 0}
.demo .chrome{background:#e8e6e1;padding:7px 11px;display:flex;gap:6px;align-items:center;
  border-bottom:1px solid #d5d2cb}
.demo .dot{width:9px;height:9px;border-radius:50%}
.demo .pad{padding:16px}
.demo .topbar{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.demo .topbar .nm{font-weight:600;color:#3d3929;font-size:14px}
.demo .topbar button{background:none;border:1px solid #ccc8bf;border-radius:5px;
  padding:3px 8px;font-size:11px;cursor:pointer;color:#5c574a}
.demo .breadcrumb{font-size:11.5px;color:#8a8578;margin-bottom:18px;
  display:flex;align-items:center;gap:7px;position:relative}
.demo .breadcrumb .ex{color:#c96442;cursor:pointer;border-bottom:1px dashed #c96442}
.demo .menu{position:absolute;top:22px;left:0;background:#fff;border:1px solid #ddd8cf;
  border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.13);padding:5px;min-width:210px;z-index:9}
.demo .menu div{padding:7px 11px;font-size:12px;color:#3d3929;border-radius:5px;cursor:pointer}
.demo .menu div:hover{background:#f2efe9}
.demo h4{color:#3d3929;font-size:17px;margin:0 0 9px;font-weight:600}
.demo p.body{color:#5c574a;font-size:12.5px;line-height:1.65;margin:0 0 15px}
.demo .cta{background:#c96442;color:#fff;border:0;border-radius:6px;padding:8px 15px;
  font-size:12px;cursor:pointer}
.demo .browser{border-top:1px solid #ddd8cf;margin-top:16px;padding-top:12px;
  font-size:10.5px;color:#8a8578}
.demo .browser b{color:#5c574a}
.note{background:#1a2029;border-left:3px solid var(--acc2);padding:10px 14px;
  border-radius:5px;font-size:12.5px;color:#c9d1d9;margin:12px 0}
.note b{color:var(--acc2)}
.warnbox{background:#211b12;border-left:3px solid var(--warn);padding:10px 14px;
  border-radius:5px;font-size:12.5px;color:#c9d1d9;margin:12px 0}
.warnbox b{color:var(--warn)}
input[type=checkbox]{accent-color:var(--acc);cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12.5px;
  color:#c9d1d9;cursor:pointer}
.chk:hover{color:#fff}
.flagrow{display:flex;align-items:center;gap:8px;padding:4px 0;font:11.5px var(--mono);
  color:#c9d1d9}
.exported{font:11px var(--mono);color:var(--ok)}
@media(max-width:760px){
  nav{width:56px}
  nav button span.lb,nav .grp,nav button .ct{display:none}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">Claude Desktop <b>逆向图谱</b></div>
  <div class="ver">v2.42304.0 · win-x64 MSIX</div>
  <div class="pills" id="pills"></div>
</header>

<main>
  <nav id="nav"></nav>
  <section>
    <div class="searchbar">
      <input id="q" placeholder="搜索：IPC 方法 / 类名 / feature flag / 枚举 / 工具 / Go 符号 …" autocomplete="off">
      <span class="hint" id="qhint">Ctrl+K</span>
    </div>
    <div id="view"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="coverage.js"></script>
<script>
"use strict";
const D = window.ATLAS;
const D_COV = window.ATLAS_COVERAGE;
const $ = s => document.querySelector(s);
const V = $("#view"), Q = $("#q");

/* ============================ helpers ============================ */
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => n.toLocaleString("en-US");
const kb  = n => n < 1024 ? n+" B"
  : n < 1048576 ? (n/1024).toFixed(1)+" KB"
  : (n/1048576).toFixed(1)+" MB";
const ev = l => `<span class="ev ${l}">${l}</span>`;

/* persistent check / favourite state */
const LS = "atlas-cd-v1";
let ST = JSON.parse(localStorage.getItem(LS) || '{"fav":[],"done":[]}');
const save = () => localStorage.setItem(LS, JSON.stringify(ST));
const isFav = k => ST.fav.includes(k);
const isDone = k => ST.done.includes(k);
function toggle(kind, k){
  const a = ST[kind], i = a.indexOf(k);
  i < 0 ? a.push(k) : a.splice(i, 1);
  save(); render();
}

/* ============================ navigation ============================ */
const PAGES = [
  { grp: "总览" },
  { id:"home",   ic:"◈", lb:"概览",           ct: null },
  { id:"chain",  ic:"⇄", lb:"执行链",         ct: null },
  { grp: "界面" },
  { id:"ui",     ic:"▣", lb:"界面与工作流",   ct: null },
  { id:"demo",   ic:"▶", lb:"可操作复刻",     ct: null },
  { grp: "后端" },
  { id:"ipc",    ic:"⇢", lb:"IPC 服务面",     ct: D.counts.ipc_methods },
  { id:"modules",ic:"▤", lb:"主进程模块",     ct: D.counts.build_modules },
  { id:"vm",     ic:"⬢", lb:"Cowork VM",      ct: D.counts.go_symbols },
  { id:"agent",  ic:"⟳", lb:"Agent 引擎",     ct: null },
  { id:"mcp",    ic:"⊞", lb:"MCP / Skills",   ct: null },
  { id:"sec",    ic:"⛨", lb:"安全边界",       ct: null },
  { grp: "索引" },
  { id:"flags",  ic:"⚑", lb:"Feature Flags",  ct: D.counts.flags },
  { id:"enums",  ic:"≡", lb:"内部枚举",       ct: D.counts.enums },
  { id:"tools",  ic:"⚒", lb:"工具清单",       ct: D.counts.tools },
  { id:"env",    ic:"$", lb:"环境与开关",     ct: D.counts.env_vars },
  { grp: "交付" },
  { id:"cov",    ic:"◎", lb:"覆盖率与边界",   ct: null },
  { id:"mark",   ic:"★", lb:"我的标记",       ct: null },
];

let cur = "home";
function go(id){
  cur = id; Q.value = "";
  if (location.hash.slice(1) !== id) location.hash = id;
  render();
  $("#view").scrollTop = 0;
}

function renderNav(){
  $("#nav").innerHTML = PAGES.map(p =>
    p.grp ? `<div class="grp">${p.grp}</div>`
    : `<button class="${p.id===cur?'on':''}" onclick="go('${p.id}')">
         <span class="ic">${p.ic}</span><span class="lb">${p.lb}</span>
         ${p.ct!=null?`<span class="ct">${p.ct}</span>`:""}
       </button>`).join("");
}

function renderPills(){
  const c = D.counts;
  $("#pills").innerHTML = [
    ["MSIX 成员", num(c.msix_members)],
    ["主进程模块", c.build_modules],
    ["IPC 方法", num(c.ipc_methods)],
    ["Go 符号", num(c.go_symbols)],
    ["枚举", c.enums],
    ["Flags", c.flags],
  ].map(([k,v]) => `<span class="pill">${k} <b>${num(v)}</b></span>`).join("");
}

/* ============================ pages ============================ */
const P = {};

/* ---------------------------------------------------------------- home */
P.home = () => `
<h1>Claude Desktop 逆向图谱</h1>
<div class="sub">
  样本 <code>claude-desktop-x64-2bf309665f.msix</code> ·
  ${num(D.counts.msix_bytes)} 字节 ·
  SHA256 <code>2bf309665f0d…fa24ee</code>（已校验）
</div>

<div class="note">
<b>怎么用这个图谱</b>：左侧按域浏览 —— 界面、后端、索引。
顶部搜索框可跨 IPC 方法、类名、feature flag、内部枚举、工具名、Go 符号全文检索（Ctrl+K）。
每个条目右侧的 <span class="ev S">S</span> <span class="ev R">R</span>
<span class="ev D">D</span> <span class="ev I">I</span> <span class="ev U">U</span>
是证据等级，含义见下方。条目可勾选「已核对」、可标星收藏，状态保存在浏览器本地。
</div>

<h2>证据等级</h2>
<table>
<tr><th>等级</th><th>含义</th><th>本图谱中的用法</th></tr>
<tr><td>${ev("S")}</td><td>源码 / 符号直接可见</td><td>从 asar、ion-dist、Go 符号表读出的确定事实</td></tr>
<tr><td>${ev("R")}</td><td>运行时实际观测</td><td>实际启动进程、截图、UIA 树、stderr</td></tr>
<tr><td>${ev("D")}</td><td>官方文档</td><td>Anthropic 帮助中心文章</td></tr>
<tr><td>${ev("I")}</td><td>推断</td><td>由命名 / 结构推断，未经运行时验证</td></tr>
<tr><td>${ev("U")}</td><td>不可获得</td><td>服务端实现、区域门禁后的界面</td></tr>
</table>

<h2>四个可执行体</h2>
<div class="grid">
  <div class="card static">
    <div class="t">claude.exe</div>
    <div class="n">${kb(245756240)}</div>
    <div class="d">Electron 主进程 + Chromium。窗口、菜单、托盘、更新、全部 IPC 服务端。</div>
  </div>
  <div class="card static">
    <div class="t">cowork-svc.exe</div>
    <div class="n">${kb(13761360)}</div>
    <div class="d">Go 二进制。Hyper-V / HCS 虚拟机运行时，hvsock RPC，EDR 门禁。
      <a class="src" onclick="go('vm')">展开 →</a></div>
  </div>
  <div class="card static">
    <div class="t">claude-ssh-*.exe</div>
    <div class="n">3</div>
    <div class="d">askpass / broker / proxy，SSH 子系统。</div>
  </div>
  <div class="card static">
    <div class="t">chrome-native-host.exe</div>
    <div class="n">1</div>
    <div class="d">浏览器扩展 ↔ 桌面端原生消息宿主。</div>
  </div>
</div>

<h2>规模</h2>
<div class="grid">
  ${[
    ["MSIX 成员", D.counts.msix_members, "解包后共 4,443 个成员"],
    ["主进程 JS 模块", D.counts.build_modules, ".vite/build 下的 chunk"],
    ["IPC 方法", D.counts.ipc_methods, `${D.counts.ipc_classes} 个服务类`],
    ["Go 符号", D.counts.go_symbols, `cowork-svc，${D.counts.go_packages} 个自有包`],
    ["内部枚举", D.counts.enums, "从产品代码恢复的分类表"],
    ["Feature Flags", D.counts.flags, "含大量未公开代号"],
    ["工具名", D.counts.tools, "内置工具词表"],
    ["偏好项", D.counts.prefs, "带 .meta 分类的 schema 项"],
  ].map(([t,n,d]) => `
    <div class="card static">
      <div class="t">${t}</div>
      <div class="n">${num(n)}</div>
      <div class="d">${d}</div>
    </div>`).join("")}
</div>

<h2>最重要的结论</h2>
<ul class="clean">
  <li><b>Agent Loop 不在桌面端。</b>桌面端把引擎作为子进程拉起，用 stdio 上的
    NDJSON 通信，自己只做权限决策与 UI。
    <a class="src" onclick="go('agent')">看执行链 →</a></li>
  <li><b>产品逻辑大部分在 Web 包里。</b><code>ion-dist</code> 是 4,224 个文件的
    claude.ai 前端构建产物，桌面端负责"能力供给"。</li>
  <li><b>Cowork 是真实虚拟机。</b>Hyper-V + HCS + gVisor + hvsock 签名校验，
    不是容器也不是普通沙箱。<a class="src" onclick="go('vm')">看 VM →</a></li>
  <li><b>CDP 被 Ed25519 签名锁死。</b>私钥不在客户端，所以运行时内省只能走
    UI Automation。<a class="src" onclick="go('sec')">看安全模型 →</a></li>
  <li><b>有大量未公开代号功能。</b>130 个 feature flag 里
    <code>quietPenguin</code>、<code>sableOtter</code>、<code>yukonSilver</code>、
    <code>copperLark</code> 等代号默认关闭且在文档中不存在。
    <a class="src" onclick="go('flags')">看全部 →</a></li>
</ul>
`;

/* --------------------------------------------------------------- chain */
P.chain = () => `
<h1>执行链：一次对话到底走了什么</h1>
<div class="sub">Cowork 本地模式全链路。${ev("S")} 参数与顺序均来自源码</div>

<h2>① 用户输入 → IPC</h2>
<p>渲染进程（<code>ion-dist</code>）通过 <code>$eipc_message$_…</code> 通道发起调用。
命名为 <code>&lt;module&gt;_$_&lt;Class&gt;_$_&lt;method&gt;</code>，
全库共 <b>${num(D.counts.ipc_methods)}</b> 个方法、<b>${D.counts.ipc_classes}</b> 个类。</p>
<pre>$eipc_message$_6010a08f-a0fa-48b4-99da-0689b9e2de7b_$_claude.web_$_LocalSessions_$_sendMessage
                    └──────────── 服务域 UUID ────────────┘  └module┘ └─── 类 ───┘ └─ 方法 ─┘</pre>

<h2>② 主进程组装 SDK options</h2>
<p><code>ProcessTransport</code> 按 30+ 条规则把 options 翻译成命令行。基础参数固定为：</p>
<pre>--output-format stream-json --verbose --input-format stream-json</pre>
<p>这三者共同定义了 <b>双向 NDJSON over stdio</b> 的通信协议。</p>

<h2>③ spawn 子进程</h2>
<pre>env.CLAUDE_CODE_ENTRYPOINT = "sdk-ts"      ← 告诉引擎「你是被 SDK 拉起的」
delete env.NODE_OPTIONS                     ← 防止外部注入
delete env.DEBUG                            ← 除非显式开启
spawn(command, args, { cwd, env, signal })</pre>

<h2>④ 引擎内部跑 agent loop</h2>
<div class="mark" style="margin:10px 0">
<pre>while (stop_reason === "tool_use") {
    stream assistant content
    if (tool_use) {
        ask host for permission   ──►  --permission-prompt-tool=stdio
        run hooks                 ──►  PreToolUse 可返回 updatedInput 改写入参
        execute tool
        run PostToolUse
    }
}</pre>
</div>
<p>这个循环<b>不在本样本内</b>：它在引擎二进制里。桌面端只看到流事件。</p>

<h2>⑤ 权限回宿主</h2>
<p>argv 里加 <code>--permission-prompt-tool=stdio</code>，引擎就把权限问题写成一条
stdio 消息。桌面端 <code>ToolPermissionBroker</code> 接住，弹出 <code>host_dialog</code>，
用户选 <code>once</code> / <code>always</code> / <code>scheduled</code> / <code>deny</code>，</p>
<pre>{ behavior: "allow" | "deny",
  updatedInput: {...},
  updatedPermissions: [{ type:"setMode", mode, destination:"session" }],
  decisionClassification: "user_reject" | "user_temporary" | "user_permanent",
  approvalSurface: "host_dialog" }</pre>

<h2>⑥ 流回与渲染</h2>

<h2>唯一的逃生门：Ed25519 签名的 CDP 授权</h2>
<p><code>iQ()</code> 必须<b>同时</b>满足：</p>

/* ============================ search ============================ */
function search(q){
  q = q.trim().toLowerCase();
  if (q.length < 2) { render(); return; }
  const hits = [];
  const add = (kind, name, extra) => hits.push({kind, name, extra});

  D.ipc.forEach(r => {
    if (r.cls.toLowerCase().includes(q)) add("IPC 类", r.cls, `${r.n} 个方法`);
    r.methods.forEach(m => { if (m.toLowerCase().includes(q)) add("IPC 方法", m, r.cls); });
  });
  D.flag_groups.forEach(g => g.flags.forEach(f => {
    if (f.toLowerCase().includes(q)) add("Feature Flag", f, g.label);
  }));
  D.prefs.forEach(p => {
    if (p.name.toLowerCase().includes(q)) add("偏好项", p.name, p.category);
  });
  D.enums.forEach(e => {
    e.items.forEach(it => {
      if (String(it).toLowerCase().includes(q))
        add("枚举条目", String(it), `${e.kind} · ${e.n} 项 · ${e.file}`);
    });
  });
  D.modules.forEach(m => {
    if (m.name.toLowerCase().includes(q)) add("模块", m.name, kb(m.bytes));
  });
  D.tools.forEach(t => { if (t.toLowerCase().includes(q)) add("工具", t, "工具词表"); });
  D.env_vars.forEach(v => { if (v.toLowerCase().includes(q)) add("环境变量", v, ""); });
  D.go.forEach(g => {
    if (g.sym.toLowerCase().includes(q)) add("Go 符号组", g.sym, `${g.n} 个函数`);
    g.fns.forEach(f => { if (f.toLowerCase().includes(q)) add("Go 函数", f, g.sym); });
  });

  const seen = new Set(), uniq = [];
  for (const h of hits){
    const k = h.kind + "|" + h.name;
    if (!seen.has(k)) { seen.add(k); uniq.push(h); }
  }

  V.innerHTML = `
<h1>搜索 “${esc(q)}”</h1>
<div class="sub">${uniq.length} 条结果${uniq.length>=400?"（只显示前 400 条）":""}</div>
${uniq.length === 0 ? `<div class="empty">没有匹配项</div>` : `
<table>
<tr><th style="width:120px">类别</th><th>命中</th><th>上下文</th></tr>
${uniq.slice(0,400).map(h=>`<tr>
  <td><span class="tag">${esc(h.kind)}</span></td>
  <td class="mono">${esc(h.name)}</td>
  <td style="color:var(--dim);font-size:11.5px">${esc(h.extra||"")}</td>
</tr>`).join("")}
</table>`}`;
}

});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){
    e.preventDefault(); Q.focus(); Q.select();
  }
  if (e.key === "Escape" && document.activeElement === Q){
    Q.value = ""; render(); Q.blur();
  }
});
