.src.dream { color: var(--dream); background: var(--dream-bg); }

/* search results */
.results { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

.hit .t { min-width: 0; }

mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

.day { display: grid; gap: 8px; }
.day h3 { font-size: 13px; margin: 0; color: var(--fg-2); font-weight: 500; display: flex; gap: 10px; align-items: baseline; position: sticky; top: 0; background: var(--bg); padding-block: 4px; z-index: 1; }

.open { font-size: 11px; color: var(--warn); white-space: nowrap; }
.detail { border-top: 1px dashed var(--line); padding: 12px 14px 14px 70px; display: grid; gap: 10px; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.more { text-align: center; color: var(--fg-3); font-size: 12px; padding: 10px; }

.plist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; }

// ---- state ----
const state = { view: "timeline", q: "", src: new Set(), range: "all", project: "", proj: 0, expanded: new Set(["e1"]) };
const VIEWS = [

  ["people", "人", "12"], ["me", "关于你", "41"], ["changes", "变动记录", ""],
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hl(text) {
  const t = esc(text);
  const words = state.q.trim().split(/\s+/).filter(w => w.length > 0);
  if (!words.length) return t;
  return words.reduce((acc, w) => acc.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`), t);
}
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }

function renderNav() {
  $("nav").innerHTML = VIEWS.map(([k, n, c]) => `<button data-view="${k}" ${state.view === k ? 'aria-current="page"' : ""}><span>${n}</span><span class="n">${c}</span></button>`).join("");

    <button class="btn small" id="dream" style="margin-top:6px">立即整理</button>`;
}
function renderFilters() {
  const srcs = Object.entries(SRC).map(([k, v]) => `<button class="chip" data-src="${k}" aria-pressed="${state.src.has(k)}">${v.name}</button>`).join("");
  const ranges = [["today", "今天"], ["7d", "7 天"], ["30d", "30 天"], ["all", "全部"]].map(([k, n]) => `<button class="chip" data-range="${k}" aria-pressed="${state.range === k}">${n}</button>`).join("");
  const projOpts = `<option value="">全部项目</option>` + PROJECTS.map(p => `<option ${state.project === p.title ? "selected" : ""}>${esc(p.title)}</option>`).join("");
  $("filters").innerHTML = `<span class="lbl">来源</span>${srcs}<span class="sep"></span><span class="lbl">时间</span>${ranges}<span class="sep"></span><select class="chip" id="proj" aria-label="项目">${projOpts}</select>`;
}

function allItems() {
  const items = [];
  EPISODES.forEach(e => items.push({ kind: "episode", s: "episode", text: `${e.title}：${e.out}`, extra: [...e.decisions, ...e.facts, ...e.files].join(" · "), at: `${e.day.slice(5)} ${e.time}`, day: e.day, where: `经历/${e.day}.md`, ref: e.id, project: e.project }));
  PROJECTS.forEach(p => Object.entries(p.sections).forEach(([sec, lines]) => lines.forEach(l => items.push({ kind: "dream", s: l.s, text: l.t, extra: l.why || "", at: p.updated, day: "2026-10-16", where: `事/${p.title}.md · ${sec}`, ref: l.ref, project: p.title }))));
  ME.forEach(m => items.push({ kind: "fact", s: m.s, text: m.t, extra: "", at: m.at, day: "2026-10-1", where: "我.md", ref: null, project: "" }));
  Object.entries(RAW).forEach(([ref, msgs]) => msgs.filter(m => m.role).forEach(m => items.push({ kind: "raw", s: "raw", text: m.text, extra: "", at: EPISODES.find(e => e.id === ref).day.slice(5), day: EPISODES.find(e => e.id === ref).day, where: "原对话", ref, project: EPISODES.find(e => e.id === ref).project })));
  return items;
}
function filtered(items) {
  const words = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter(it => {
    if (state.src.size && !state.src.has(it.s)) return false;
    if (state.project && it.project !== state.project) return false;
    if (state.range === "today" && it.day !== "2026-10-16") return false;
    if (state.range === "7d" && it.day < "2026-10-10") return false;
    if (!words.length) return true;
    const hay = (it.text + " " + it.extra + " " + it.project).toLowerCase();
    return words.some(w => hay.includes(w));
  }).map(it => {
    const hay = (it.text + " " + it.extra).toLowerCase();
    const hits = words.filter(w => hay.includes(w)).length;
    return { ...it, score: words.length ? (0.45 + 0.5 * hits / words.length - (it.kind === "raw" ? 0.08 : 0)) : 0.5 };
  }).sort((a, b) => b.score - a.score);
}

function viewSearch() {
  const res = filtered(allItems());
  const q = state.q.trim();
  return `<div class="wrap">
    <div class="head"><h2>${q ? `“${esc(q)}”` : "搜索全部记忆"}</h2><p>找到 ${res.length} 条 · 关键词 + 向量混合排序，旧日记按 30 天半衰</p></div>
    ${res.length ? `<div class="results">${res.slice(0, 40).map(h => `
      <div class="hit"><div class="t">${hl(h.text)}${h.extra ? `<div class="note">${hl(h.extra)}</div>` : ""}</div>
        <span class="score">${h.score.toFixed(2)}</span>
        <div class="meta">${srcTag(h.s)}<span>${esc(h.where)}</span><span>${esc(h.at)}</span>${h.ref ? `<button class="ref" data-ref="${h.ref}">出处 ${h.ref}</button>` : ""}</div></div>`).join("")}</div>`
      : `<div class="results"><div class="empty">没搜到。试试换个说法，或者在来源里勾上「原对话」，连完整对话一起搜。</div></div>`}
  </div>`;
}

function epCard(e) {
  const open = state.expanded.has(e.id);
  const facet = (n, arr, code) => arr.length ? `<div class="facet"><dt>${n}</dt><dd>${arr.map(x => code ? `<code>${esc(x)}</code>` : `<span>${hl(x)}</span>`).join("")}</dd></div>` : "";
  return `<article class="ep">
    <button data-toggle="${e.id}" aria-expanded="${open}">
      <span class="time">${e.time}</span>
      <span><div class="title">${hl(e.title)}</div><div class="out">${hl(e.out)}</div></span>
      <span class="tags">${e.open.length ? `<span class="open">${e.open.length} 件没做完</span>` : ""}<span class="ver ${e.ver ? "" : "no"}">${e.ver ? "已验证" : "未验证"}</span></span>
    </button>
    ${open ? `<dl class="detail">
      ${facet("定下的", e.decisions)}${facet("关键数字", e.facts)}${facet("改过的文件", e.files, true)}${facet("跑过的命令", e.commands, true)}${facet("没做完", e.open)}${facet("步骤", e.steps, true)}
      <div class="facet"><dt>项目</dt><dd><span>${esc(e.project)}</span></dd></div>
      <div class="actions"><button class="btn small" data-ref="${e.id}">打开原对话</button><button class="btn small" data-act="edit">改</button><button class="btn small" data-act="forget">忘掉</button></div>
    </dl>` : ""}
  </article>`;
}
function viewTimeline() {
  const eps = EPISODES.filter(e => (!state.project || e.project === state.project) && (state.range !== "today" || e.day === "2026-10-16"));
  const days = [...new Set(eps.map(e => e.day))];
  const wk = d => "日一二三四五六"[new Date(d + "T12:00:00").getDay()];
  return `<div class="wrap">
    <div class="head"><h2>时间线</h2><p>每个会话每天一条经历，点开看决定、文件、命令和没做完的事</p></div>
    ${days.map(d => `<section class="day"><h3>${d.slice(5).replace("-", " 月 ")} 日 · 周${wk(d)} <span class="mono">${eps.filter(e => e.day === d).length} 条</span></h3>${eps.filter(e => e.day === d).map(epCard).join("")}</section>`).join("")}
    <div class="more">往下滚自动加载更早的 · 已加载到 10-14（共 1,284 条）</div>
  </div>`;
}
function viewProjects() {
  const p = PROJECTS[state.proj];
  const sec = (name) => {
    const lines = p.sections[name] || [];
    return `<section class="sec"><h4>${name}</h4>${lines.length ? lines.map(l => `
      <div class="line"><div>${hl(l.t)}${l.why ? `<div class="why">${esc(l.why)}</div>` : ""}</div>
      <div class="r">${srcTag(l.s)}<button class="ref" data-ref="${l.ref}">出处</button></div></div>`).join("") : `<div class="note">暂无</div>`}</section>`;
  };
  return `<div class="wrap" style="max-width:1100px">
    <div class="head"><h2>项目</h2><p>每晚把零散经历合并成项目页；「你说的」行整理时原样保留</p></div>
    <div class="proj">
      <nav class="plist" aria-label="项目列表">${PROJECTS.map((x, i) => `<button data-proj="${i}" aria-current="${i === state.proj}"><b>${esc(x.title)}</b><span class="pm"><span>${x.count} 条</span><span>${x.updated}</span>${x.open ? `<span class="open">${x.open} 件没做完</span>` : ""}</span></button>`).join("")}</nav>
      <article class="pdoc"><div class="head"><h3>${esc(p.title)}</h3><span class="note">事/${esc(p.title)}.md · 更新于 ${p.updated}</span></div>
        ${["现在状态", "定下的决定", "没做完", "来龙去脉"].map(sec).join("")}
      </article>
    </div></div>`;
}
const factRow = f => `<div class="fact"><span>${hl(f.t)}</span><span class="ops">${srcTag(f.s)}${f.at ? `<span class="note">${f.at}</span>` : ""}<button class="link" data-act="edit">改</button><button class="link" data-act="forget">忘掉</button></span></div>`;
function viewPeople() {
  return `<div class="wrap"><div class="head"><h2>人</h2><p>每人一页，别名会自动认出同一个人</p></div>
    <div class="cards">${PEOPLE.map(p => `<div class="card"><h3>${esc(p.name)} <small>也叫 ${p.alias.map(esc).join("、")}</small></h3>${p.facts.map(factRow).join("")}</div>`).join("")}</div></div>`;
}
function viewMe() {
  return `<div class="wrap"><div class="head"><h2>关于你</h2><p>每轮都会带进对话。只记你亲口说的，不对就直接改</p></div>
    <div class="list">${ME.map(factRow).join("")}</div>
    <button class="btn" data-act="add" style="justify-self:start">加一条</button></div>`;
}
function viewChanges() {
  const rows = CHANGES.filter(c => !state.src.size || state.src.has(c.s));
  return `<div class="wrap"><div class="head"><h2>变动记录</h2><p>每次变动都是一个 git 提交，可以撤销（忘掉的内容不能撤回）</p></div>
    <div class="list">${rows.map(c => `<div class="chg"><span class="when">${c.when}</span><div class="diff"><b>${esc(c.what)}</b>${c.add.map(a => `<span class="add">+ ${esc(a)}</span>`).join("")}${c.del.map(a => `<span class="del">${esc(a)}</span>`).join("")}</div><span>${srcTag(c.s)} <button class="link" data-act="undo">撤销</button></span></div>`).join("")}</div></div>`;
}

function render() {
  renderNav(); renderFilters();
  const v = { search: viewSearch, timeline: viewTimeline, projects: viewProjects, people: viewPeople, me: viewMe, changes: viewChanges }[state.view];
  $("content").innerHTML = v();

function openDrawer(ref) {
  const e = EPISODES.find(x => x.id === ref);
  const msgs = RAW[ref] || [{ role: "user", text: e.title, focus: true }, { role: "assistant", text: e.out }];
  $("overlay").innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-label="出处">
      <div class="dhead"><div class="top"><h3>出处 · ${esc(e.title)}</h3><button class="btn small" data-close>关闭</button></div>
        <span class="note mono">${e.session}@2026-${e.day.slice(5)}T${e.time} · 原对话这一轮的完整内容</span>
        <div class="actions" style="margin-top:6px"><button class="btn small primary" data-act="goto">在对话里打开</button><button class="btn small" data-act="wider">多看前后一轮</button></div></div>
      <div class="dbody">${msgs.map(m => m.tool
        ? `<details class="tool"><summary><span class="${m.ok ? "okm" : "bad"}">${m.ok ? "✓" : "✗"}</span>${esc(m.tool)} <span style="color:var(--fg-3)">${esc(m.args)}</span></summary><pre>${esc(m.out)}</pre></details>`
        : `<div class="msg ${m.role} ${m.focus ? "focus" : ""}"><span class="who">${m.role === "user" ? "你" : "Atlas"}</span><div class="bubble">${esc(m.text)}</div></div>`).join("")}</div>
    </aside>`;
  $("overlay").hidden = false;
  $("overlay").querySelector(".drawer button").focus();
}
function closeDrawer() { $("overlay").hidden = true; $("overlay").innerHTML = ""; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("button, [data-close]");
  if (!b) return;
  if (b.dataset.view) { state.view = b.dataset.view; render(); $("content").scrollTop = 0; return; }
  if (b.dataset.src) { state.src.has(b.dataset.src) ? state.src.delete(b.dataset.src) : state.src.add(b.dataset.src); if (state.view !== "changes") state.view = "search"; render(); return; }
  if (b.dataset.range) { state.range = b.dataset.range; render(); return; }
  if (b.dataset.toggle) { const id = b.dataset.toggle; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render(); return; }
  if (b.dataset.proj) { state.proj = +b.dataset.proj; render(); return; }
  if (b.dataset.ref) { openDrawer(b.dataset.ref); return; }
  if (b.hasAttribute("data-close")) { closeDrawer(); return; }
  if (b.id === "dream") { b.disabled = true; b.textContent = "正在整理…"; setTimeout(() => { b.disabled = false; b.textContent = "立即整理"; toast("整理完成：更新了 2 个项目页，新增 3 行"); }, 1100); return; }
  const act = b.dataset.act;
  if (act === "forget") toast("已忘掉：页面、日记、历史记录都已抹掉（原型里不会真删）");
  else if (act === "edit") toast("在这一行原地改，回车保存（原型只演示入口）");
  else if (act === "add") toast("会在「关于你」末尾加一行，来源标成「你改的」");
  else if (act === "undo") toast("已撤销这次变动");
  else if (act === "goto") toast("跳到那个会话的这一轮");
  else if (act === "wider") toast("已多带前后各一轮");
});
document.addEventListener("change", ev => { if (ev.target.id === "proj") { state.project = ev.target.value; render(); } });
let deb;
$("q").addEventListener("input", ev => { clearTimeout(deb); deb = setTimeout(() => { state.q = ev.target.value; state.view = state.q.trim() ? "search" : (state.view === "search" ? "timeline" : state.view); render(); }, 300); });
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); $("q").focus(); }
  if (ev.key === "Escape" && !$("overlay").hidden) closeDrawer();
});
render();
</script>
