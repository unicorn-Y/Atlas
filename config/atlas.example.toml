# Atlas Configuration
# Copy this to atlas.toml and customize

[general]
name = "Atlas"
version = "0.1.0"
data_dir = "./data"

[server]
host = "0.0.0.0"
port = 8765

[models]
# Default model when Atlas starts
default = "claude-sonnet-4"

# API gateway (monkeyapi or direct)
[models.gateway]
base_url = "https://api.monkeyapi.net"
# api_key = "sk-xxx"  # or set ATLAS_API_KEY env var

# Optional: add custom models
# [[models.custom]]
# id = "my-local-model"
# name = "Local Llama"
# provider = "ollama"
# litellm_model = "ollama/llama3.1"
# category = "local"

[memory]
db_path = "./data/atlas.db"
# max_context_messages = 50

[scheduler]
enabled = true
# timezone = "Asia/Shanghai"

[notifications]
# Windows Toast notifications
toast_enabled = true

# Telegram bot (optional)
# [notifications.telegram]
# bot_token = "..."
# chat_id = "..."

[tools]
# MCP servers to auto-start (names must match [tools.servers.*] keys)
auto_start = [
    "filesystem",
    # "brave-search",
    # "git",
]

# -- MCP server definitions --

[tools.servers.filesystem]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "D:/Atlas"]

[tools.servers.brave-search]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
env = { BRAVE_API_KEY = "" }

[tools.servers.git]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-git"]

# Example SSE server:
# [tools.servers.custom-remote]
# transport = "sse"
# url = "http://localhost:3001/sse"

[logging]
level = "INFO"
format = "json"
