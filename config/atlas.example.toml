# Atlas Configuration
# Copy this to atlas.toml and customize

[general]
name = "Atlas"
version = "0.1.0"
data_dir = "./data"

[server]
host = "127.0.0.1"
port = 8765

[models]
# Default model when Atlas starts
default = "claude-sonnet-4"
prompt_cache = "auto" # auto | off; applies to Claude models by default
prompt_cache_ttl = "5m" # 5m | 1h
max_output_tokens = 16384
fallback = [] # Optional ordered model IDs to try after transient provider failures.

[agents]
# Optional IDs from the configured model list. Empty values inherit the parent model.
fast_model = ""
strong_model = ""

[delegation]
max_concurrent_children = 3
max_spawn_depth = 2

[moa]
reference_models = []
max_references = 3

[agent]
engine = "hermes"
verify_before_stop = true

[engine]
kernel = "atlas" # atlas | hermes
workflow_max_parallel = 4

# 技能与工具库（省 token）：技能索引只放本轮最相关的几条，少用的工具 / MCP 工具折叠成名字清单
[library]
skill_index_top_k = 12            # 每轮提示词里列出的技能数
skill_index_list_all_below = 30   # 技能总数少于这个数时全部列出
defer_tools = true                # 折叠少用的工具，模型用 tool_search 按需加载
defer_min_tools = 30              # 工具总数超过这个数才折叠
auto_load = 3                     # 每轮按用户消息自动展开最相关的几个折叠工具
core_tools = []                   # 永远不折叠的工具名

# API gateway (monkeyapi or direct)
[models.gateway]
base_url = "https://api.monkeyapi.net"
# api_key = "sk-xxx"  # or set ATLAS_API_KEY env var

# Optional: add custom models
# [[models.custom]]
# id = "my-local-model"
# name = "Local Llama"
# provider = "ollama"
# litellm_model = "ollama/llama3.1"
# category = "local"

[memory]
db_path = "./data/atlas.db"
# max_context_messages = 50

[agent.context_maintenance]
message_limit = 80
character_limit = 80000

[agent.trajectory_reviewer]
enabled = false
# Set backend = "litellm" and model = "provider/model" to enable the reviewer.
# backend = "litellm"
# model = "openai/gpt-4o-mini"

[scheduler]
enabled = true
# timezone = "Asia/Shanghai"

[notifications]
# Windows Toast notifications
toast_enabled = true

# Telegram bot (optional)
# [notifications.telegram]
# bot_token = "..."
# chat_id = "..."

[web]
# web_search / web_fetch walk these providers in order and fail over to the next one.
# Providers without a key are skipped, so the defaults work out of the box (free tiers + ddgs).
# search_order    = ["exa", "brave", "parallel", "perplexity", "tavily", "keenable", "searxng", "keyless", "bocha", "ddgs"]
# search_order_zh = ["bocha", "keyless", "exa", "brave", "parallel", "tavily", "searxng", "ddgs"]  # mostly-Chinese queries
# extract_order   = ["local", "exa", "parallel", "tavily", "keenable", "keyless"]
keyless = true              # anonymous free tiers of Exa / Parallel / Keenable / Tavily (rate-limited)
cache_ttl_minutes = 20
extract_char_limit = 15000  # longer pages return head + tail; the full text is saved for read_file
parallel_mode = "fast"      # turbo | fast | basic | advanced (only with a Parallel key)

[web.keys]
# Each key may instead come from its env var (BOCHA_API_KEY, EXA_API_KEY, PARALLEL_API_KEY,
# TAVILY_API_KEY, BRAVE_SEARCH_API_KEY, KEENABLE_API_KEY, PERPLEXITY_API_KEY, SEARXNG_URL).
bocha = ""       # https://open.bochaai.com — Chinese index; used first for Chinese queries
exa = ""         # https://exa.ai
parallel = ""    # https://parallel.ai
tavily = ""      # https://app.tavily.com
brave = ""       # https://brave.com/search/api/
# searxng = "http://localhost:8080"

[tools]
# Warn after this many same-file edits in one run.
same_file_edit_reminder_threshold = 6
# MCP servers are configured explicitly after first launch.
auto_start = []

[tool_output]
max_bytes = 50000
max_lines = 2000
max_line_length = 2000

# P18X capability toggles; integrations remain independently disableable.
[integrations.agents]
codex = true
claude = true
hermes = true
pi = true
zcode = true

[integrations.computer]
cua = true
pywinauto = true

[integrations.browser]
browser_use = true
playwright_mcp = true
devtools_mcp = true

[integrations.coding]
serena = true
ast_grep = true
repo_map = true

[integrations.durable]
dbos = true

# MCP launchers use pinned npm versions through Atlas's bundled Node runtime.
[tools.servers.playwright]
transport = "stdio"
command = "npx"
args = ["--yes", "@playwright/mcp@0.0.83"]
enabled = true

[tools.servers.chrome-devtools]
transport = "stdio"
command = "npx"
args = ["--yes", "chrome-devtools-mcp@1.10.1", "--headless", "--no-usage-statistics"]
enabled = true

[tools.servers.serena]
transport = "stdio"
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context", "claude-code", "--open-web-dashboard", "false"]
enabled = true

[gateway]
default_permission_mode = "full_access"
approval_timeout_seconds = 600

[local_execution]
# Local CLI, filesystem, process, and Git tools are unrestricted by default.
# Change this explicitly to deny to opt into a blocked mode.
permission_mode = "full_access"

[computer_use]
# Real Windows desktop observation and input are unrestricted by default.
# Change this explicitly to deny to opt into a blocked mode.
permission_mode = "full_access"

# Example MCP configuration (add it after first launch):
# [tools.servers.filesystem]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "~/Documents"]

# Example SSE server:
# [tools.servers.custom-remote]
# transport = "sse"
# url = "http://localhost:3001/sse"

[logging]
level = "INFO"
format = "json"

# C6 语言服务（LSP）：编辑文件后实时给出诊断。默认开启，只读探测 PATH 上已有的服务，绝不自动安装。
# [lsp]
# enabled = true                 # 总开关；false 时所有语言服务保持关闭
# wait_mode = "document"         # 诊断等待模式："document" 只等当前文件，其他值为尽快返回
# wait_timeout = 5.0             # 每次编辑后等待诊断的秒数（默认 5 秒）
# idle_timeout = 600             # 语言服务空闲多少秒后自动退出（最低 30 秒；0 表示不回收）
# trusted_workspaces = []        # 额外信任的目录列表（如 ["~/code/my-app"]），信任后服务可加载项目自带配置
# exclude_roots = []             # 永不启用语言服务的目录 glob（如 ["~/big-monorepo", "/srv/*/vendor"]）
# 内置服务表可用 lsp.servers.<名称> 覆盖（command / env / initialization_options / disabled），
# 也可声明全新的自定义服务（需要 command 与 extensions 两个字段）。
[user]
# IANA timezone for relative time and reminder interpretation. Empty follows
# the operating system timezone, mapped to its IANA rules (including DST).
timezone = ""

[expert]
# 专家模式的内容目录（独立 git 仓库）。不填就是 ~/.atlas-expert；目录不存在时按 repo 克隆。
# dir = "~/.atlas-expert"
repo = "https://github.com/unicorn-Y/atlas-expert.git"

[memory.library]
# 透明记忆库（docs/memory/PLAN-V1.md）：data/memory 下的 Markdown + git，每轮自动读写
enabled = true
# root = "D:/Atlas/data/memory"
# writer_model = ""          # 提炼记忆固定用的模型；空 = 设置里的 memory_model → compression_model → 当前模型
# writer_timeout_seconds = 90
