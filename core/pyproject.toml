[project]
name = "atlas-core"
version = "0.1.0"
description = "Atlas AI Agent - Core Backend"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "sherpa-onnx>=1.12.20",
    "litellm>=1.50.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=4.0.0a5",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "tomli>=2.0.0",
    "structlog>=24.4.0",
    "mcp>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "packaging>=23.0",
    "mss>=10.0.0",
    # P18X upstream integrations (versions pinned for reproducible packaging).
    "cua-driver==0.28.2",
    "pywinauto==0.6.9",
    "browser-use==0.13.10",
    "dbos==3.0.0",
    "claude-agent-sdk==0.2.157",
    "agent-client-protocol==0.12.1",
    "apprise>=1.9.0",
    "asyncssh>=2.18.0",
    "watchdog>=6.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "keyring>=25.0",
    "pypdf>=5.0",
    "trafilatura>=2.0",
    "youtube-transcript-api>=1.2",
    "hermes-agent @ git+https://github.com/unicorn-Y/hermes-agent.git@27c63095b002b531b07bd6ad31da88bfe821f55f",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
terminal = ["pywinpty>=2.0.13; platform_system == 'Windows'"]
release = ["pyinstaller>=6.11"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
