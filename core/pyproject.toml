[project]
name = "atlas-core"
version = "0.1.0"
description = "Atlas AI Agent - Core Backend"
# 3.11, because that is what Atlas actually runs on. Three other places in this
# repository already say so — [tool.ruff] target-version = "py311", the runtime
# check in atlas/api/diagnostics_router.py (>= 3, 11), and the interpreter the
# editable install lives in (3.11.16). This line alone said 3.14, which made
# `pip install -e ./core` fail outright:
#   ERROR: Package 'atlas-core' requires a different Python: 3.11.16 not in '>=3.14'
# The intent behind 3.14 was presumably to move forward eventually; raising this
# floor without raising the runtime is not a plan, it is a broken install.
requires-python = ">=3.11"
readme = "README.md"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "fastembed>=0.7.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "sherpa-onnx>=1.12.20",
    "litellm>=1.50.0",
    "anthropic>=0.76.0",
    "json-repair>=0.60.0",
    "charset-normalizer>=3.4.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=4.0.0a5",
    "tzlocal>=5.2",
    "httpx>=0.27.0",
    "httpcore>=1.0.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "structlog>=24.4.0",
    "numpy>=2.0.0",
    "psutil>=6.0.0",
    "Pygments>=2.18.0",
    "requests>=2.32.0",
    "snowballstemmer>=2.2.0",
    "tiktoken>=0.8.0",
    "truststore>=0.10.0",
    "croniter>=6.0.0",
    "mcp>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "packaging>=23.0",
    "semantic-version>=2.10.0",
    "mss>=10.0.0",
    # P18X upstream integrations (versions pinned for reproducible packaging).
    "cua-driver==0.34.1",
    "pywinauto==0.6.9",
    "pynput>=1.7.7",
    "cryptography>=41.0.0",
    "Pillow>=10.0.0",
    # U36 local OCR: RapidOCR ships multilingual ONNX inference; model weights are
    # fetched lazily into DATA_ROOT on the first image request.
    "rapidocr>=3.10.0",
    "onnxruntime>=1.23.0",
    "browser-use==0.13.11",
    "dbos==3.2.0",
    "claude-agent-sdk==0.2.165",
    "agent-client-protocol==0.12.1",
    "apprise>=1.9.0",
    "asyncssh>=2.18.0",
    "watchdog>=6.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "keyring>=25.0",
    "pypdf>=5.0",
    "trafilatura>=2.0",
    "ddgs>=9.0",
    "youtube-transcript-api>=1.2",
    # Aider-style tree-sitter repository map; versions follow Aider 5dc9490bb35f.
    "grep-ast==0.9.0",
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.22.1",
    # U25: ship the channel adapters in standard notebook and packaged installs;
    # keep the `channels` extra as the explicit repair path for older installs.
    "slack-sdk>=3.33.0",
    "slack-bolt>=1.18.0",
    "lark-oapi>=1.3.0",
    "dingtalk-stream>=0.24.0",
    "aiohttp>=3.9.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "ruff>=0.7.0",
]
terminal = ["pywinpty>=2.0.13; platform_system == 'Windows'"]
release = ["pyinstaller>=6.11"]
# OTLP trace export (atlas.telemetry). Optional by design: without it the module
# reports "missing dependency" and the app runs exactly as before, so a default
# install carries no exporter thread. Pin the SDK/exporter together — they share
# an ABI and drift silently when mixed across minor versions.
otel = [
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]
# Nightly skill training (atlas.evolution.skill_sleep): microsoft/SkillOpt, MIT, pinned.
learning = ["skillopt @ git+https://github.com/microsoft/SkillOpt@343db229dbd5ddaf9df6b1d5540d8bcdb2604d5c"]
daytona = ["daytona>=0.160.0"]
modal = ["modal>=1.5.0"]
vercel = ["vercel>=0.10.0"]
# Channel adapters (W2b): optional SDKs, lazily imported; missing extras degrade that
# channel only (is_available() passive probe, never an automatic install).
channels = [
    "slack-sdk>=3.33.0",
    "slack-bolt>=1.18.0",
    "lark-oapi>=1.3.0",
    "dingtalk-stream>=0.24.0",
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "defusedxml>=0.7.0",
]

[project.scripts]
atlas = "atlas.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.hatch.build.targets.wheel.force-include]
"atlas/memory/benchmarks/v1.json" = "atlas/memory/benchmarks/v1.json"
"atlas/_vendor/sqlite3.dll" = "atlas/_vendor/sqlite3.dll"

[tool.hatch.build.targets.sdist.force-include]
"atlas/memory/benchmarks/v1.json" = "atlas/memory/benchmarks/v1.json"
"atlas/_vendor/sqlite3.dll" = "atlas/_vendor/sqlite3.dll"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE001", "S110", "S112"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m unit"
# pytest's built-in defaults, kept because overriding norecursedirs replaces the
# whole list: without ".*" the stale .pytest_cache/.pytest-wave1-* dirs are
# scanned and a Windows PermissionError aborts collection for a bare `pytest`.
norecursedirs = [
    "live", ".*", "*.egg", "build", "dist", "node_modules", "venv", "_darcs", "{arch}",
]
markers = [
    "unit: isolated tests using fakes or in-process components (default)",
    "integration: tests crossing Atlas component, persistence, or process boundaries",
    "desktop: tests that interact with the real Windows desktop",
    "live: tests that call a real model provider; requires ATLAS_LIVE=1",
    "fake_provider: tests using a fake model provider; do not count as product-effect evidence",
    "flaky: retry policy supplied by pytest-rerunfailures",
]
