[project]
name = "atlas-core"
version = "0.1.0"
description = "Atlas AI Agent - Core Backend"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "sherpa-onnx>=1.12.20",
    "litellm>=1.50.0",
    "json-repair>=0.60.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=4.0.0a5",
    "tzlocal>=5.2",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "structlog>=24.4.0",
    "mcp>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "packaging>=23.0",
    "mss>=10.0.0",
    # P18X upstream integrations (versions pinned for reproducible packaging).
    "cua-driver==0.34.1",
    "pywinauto==0.6.9",
    "browser-use==0.13.11",
    "dbos==3.2.0",
    "claude-agent-sdk==0.2.165",
    "agent-client-protocol==0.12.1",
    "apprise>=1.9.0",
    "asyncssh>=2.18.0",
    "watchdog>=6.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "keyring>=25.0",
    "pypdf>=5.0",
    "trafilatura>=2.0",
    "youtube-transcript-api>=1.2",
    # Aider-style tree-sitter repository map; versions follow Aider 5dc9490bb35f.
    "grep-ast==0.9.0",
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "ruff>=0.7.0",
]
terminal = ["pywinpty>=2.0.13; platform_system == 'Windows'"]
release = ["pyinstaller>=6.11"]
# Nightly skill training (atlas.evolution.skill_sleep): microsoft/SkillOpt, MIT, pinned.
learning = ["skillopt @ git+https://github.com/microsoft/SkillOpt@343db229dbd5ddaf9df6b1d5540d8bcdb2604d5c"]
# Channel adapters (W2b): optional SDKs, lazily imported; missing extras degrade that
# channel only (is_available() passive probe, never an automatic install).
channels = [
    "slack-sdk>=3.33.0",
    "slack-bolt>=1.18.0",
    "lark-oapi>=1.3.0",
    "dingtalk-stream>=0.24.0",
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "defusedxml>=0.7.0",
]

[project.scripts]
atlas = "atlas.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.atlas.hermes]
# Hermes is installed editable from a checkout of this fork commit, not as a pip
# dependency: the fork refuses wheel/sdist builds. core/scripts/setup_hermes.py
# clones/updates the checkout (with Windows long paths) and installs it.
repository = "https://github.com/unicorn-Y/hermes-agent.git"
commit = "c9e076b41f2163445b506b1cb79862d0dab0eecd"
# Atlas 追新 (core/atlas/upstream) merges this upstream ref into the fork's branch.
upstream = "https://github.com/NousResearch/hermes-agent.git"
upstream_ref = "main"
branch = "atlas"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE001", "S110", "S112"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m unit"
# pytest's built-in defaults, kept because overriding norecursedirs replaces the
# whole list: without ".*" the stale .pytest_cache/.pytest-wave1-* dirs are
# scanned and a Windows PermissionError aborts collection for a bare `pytest`.
norecursedirs = [
    "live", ".*", "*.egg", "build", "dist", "node_modules", "venv", "_darcs", "{arch}",
]
markers = [
    "unit: isolated tests using fakes or in-process components (default)",
    "integration: tests crossing Atlas component, persistence, or process boundaries",
    "desktop: tests that interact with the real Windows desktop",
    "live: tests that call a real model provider; requires ATLAS_LIVE=1",
    "fake_provider: tests using a fake model provider; do not count as product-effect evidence",
    "flaky: retry policy supplied by pytest-rerunfailures",
]
