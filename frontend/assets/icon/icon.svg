<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1D2738"/>
      <stop offset=".55" stop-color="#0E131D"/>
      <stop offset="1" stop-color="#06080C"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DCA2"/>
      <stop offset=".5" stop-color="#D3A055"/>
      <stop offset="1" stop-color="#8A5E22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D08F" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8A5E22" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset=".45" stop-color="#F0C878"/>
      <stop offset="1" stop-color="#9C6B27"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F6CF84" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#E0A84E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E0A84E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="212"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="512" r="430" fill="url(#glow)" opacity=".5"/>
    <!-- faint star field -->
    <g fill="#F3DDAE">
      <circle cx="190" cy="230" r="4" opacity=".55"/><circle cx="836" cy="196" r="3" opacity=".45"/>
      <circle cx="868" cy="760" r="4" opacity=".4"/><circle cx="214" cy="812" r="3" opacity=".35"/>
      <circle cx="300" cy="150" r="2.5" opacity=".35"/><circle cx="760" cy="880" r="2.5" opacity=".3"/>
    </g>
  </g>
  <rect x="42" y="42" width="940" height="940" rx="210" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- armillary sphere -->
  <g fill="none" stroke="url(#brass)" stroke-linecap="round">
    <circle cx="512" cy="512" r="330" stroke-width="30"/>
    <circle cx="512" cy="512" r="300" stroke-width="6" opacity=".45"/>
    <g stroke-width="12" opacity=".8">
      <path d="M512 160v28M512 836v28M160 512h28M836 512h28"/>
    </g>
    <ellipse cx="512" cy="512" rx="330" ry="112" stroke-width="26" transform="rotate(-23.5 512 512)"/>
    <ellipse cx="512" cy="512" rx="118" ry="330" stroke-width="18" opacity=".82"/>
  </g>

  <!-- core -->
  <circle cx="512" cy="512" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="76" fill="url(#core)"/>
  <ellipse cx="490" cy="486" rx="26" ry="18" fill="#FFFBEE" opacity=".55" transform="rotate(-30 490 486)"/>

  <!-- satellite on the ecliptic ring -->
  <circle cx="806" cy="390" r="22" fill="#F7DCA2"/>
  <circle cx="806" cy="390" r="44" fill="url(#glow)" opacity=".8"/>
</svg>
