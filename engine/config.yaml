computer_use:
  permission_mode: standard
  no_overlay: true
  cua_telemetry: false
  ax_max_elements: 200
  max_image_dimension: 1456
browser:
  mode: builtin
  use_real_profile: false
  cdp_url: ''
  headed: false
  engine: auto
  inactivity_timeout: 600
  snapshot_threshold: 15000
  dialog_policy: must_respond
  extension_control:
    enabled: false
auxiliary:
  vision:
    provider: auto
    model: ''
    base_url: ''
memory:
  provider: ''
  # NOTE: the two switches below belong to the inherited upstream memory
  # implementation and are NOT read anywhere in atlas/. Nothing in this file
  # affects whether Atlas remembers you.
  #
  # The switch that actually works is `memory.library.enabled`, read from
  # atlas.config (i.e. config/atlas.toml or user-settings.json) by
  # memory/library/__init__.py::get_library and memory/library/health.py.
  # It defaults to true. Set `[memory.library] enabled = false` there to turn
  # memory off — changing memory_enabled here does nothing and will mislead the
  # next person who debugs "why is memory not working".
  memory_enabled: false
  user_profile_enabled: false
approvals:
  mode: 'off'
  timeout: 300
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve
  smart_policy: ''
  denial_breaker_threshold: 0
  deny: []
  mcp_reload_confirm: false
  destructive_slash_confirm: false
security:
  protected_instruction_files: false
  protected_instruction_extra_patterns: []
tool_loop_guardrails:
  warnings_enabled: false
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: false
context_file_max_chars: 120000
mcp_servers:
  rea:
    command: C:\Program Files\nodejs\node.exe
    args:
    - C:\Users\25011\AppData\Roaming\npm\node_modules\rea-agents\scripts\rea.mjs
    - mcp
    env:
      GHIDRA_INSTALL_DIR: C:\Users\25011\.atlas-expert\tools\ghidra
      JAVA_HOME: C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot
      REA_JADX_MCP_JAR: C:\Users\25011\.atlas-expert\tools\jadx-mcp\jadx-headless-mcp-0.7.1-all.jar
    enabled: true
